<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Echoes of the Aether Crystal — 방치형 디펜스</title>
<style>
  :root{
    --bg:#0b0d1a; --panel:#141830; --panel2:#1d2244; --accent:#7bd3ff; --gold:#ffd75e;
    --shard:#c58bff; --hp:#57e18a; --danger:#ff6b6b; --text:#e8ecff; --muted:#8b93c4;
    --line:#2a3160;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,'Malgun Gothic',sans-serif;overflow:hidden}
  #game{display:flex;flex-direction:column;height:100%;max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;letter-spacing:.5px;color:var(--accent);
    text-shadow:0 0 10px rgba(123,211,255,.4);white-space:nowrap}
  .stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-left:auto}
  .stat{display:flex;align-items:center;gap:5px}
  .stat b{font-variant-numeric:tabular-nums}
  .g-gold{color:var(--gold)} .g-shard{color:var(--shard)} .g-wave{color:var(--accent)}
  .stage-wrap{position:relative;flex:1;min-height:0;background:#05060f}
  #stage{display:block;width:100%;height:100%;image-rendering:pixelated}
  #wavebanner{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(20,24,48,.85);border:1px solid var(--line);border-radius:20px;
    padding:4px 16px;font-size:13px;pointer-events:none;transition:opacity .3s}
  .panel{background:var(--panel);border-top:1px solid var(--line);padding:8px;
    display:flex;gap:8px;overflow-x:auto}
  .hero-card{flex:1 1 0;min-width:150px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;position:relative;transition:transform .08s}
  .hero-card.locked{opacity:.5;filter:grayscale(.7)}
  .hero-card:not(.locked):active{transform:scale(.98)}
  .hero-card h3{margin:0 0 2px;font-size:13px;display:flex;align-items:center;gap:6px}
  .hero-card .role{font-size:10px;color:var(--muted);margin-bottom:6px}
  .hero-card .stat-row{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  .hero-card .stat-row b{color:var(--text)}
  .buy{margin-top:6px;width:100%;border:0;border-radius:7px;padding:7px;cursor:pointer;
    font-weight:700;font-size:12px;background:linear-gradient(#f2c14a,#e0a72e);color:#3a2a00}
  .buy:disabled{background:#333a5c;color:#6a72a0;cursor:not-allowed}
  .buy small{display:block;font-weight:400;font-size:10px;opacity:.8}
  .skill-row{margin-top:6px;font-size:11px;color:var(--accent);display:flex;align-items:center;gap:4px}
  .cd-bar{height:4px;background:#0d1128;border-radius:3px;overflow:hidden;margin-top:3px}
  .cd-fill{height:100%;width:0%;border-radius:3px;transition:width .12s linear}
  .lock-tag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--muted);text-align:center;padding:8px}
  .controls{display:flex;gap:8px;padding:8px;background:var(--panel);
    border-top:1px solid var(--line);flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);
    border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:600}
  .btn:active{transform:scale(.97)}
  .btn.prestige{background:linear-gradient(#8b5cf6,#6d28d9);border-color:#8b5cf6}
  .btn.prestige.nudge{animation:nudgePulse 1s ease-in-out infinite}
  @keyframes nudgePulse{0%,100%{box-shadow:0 0 0 rgba(139,92,246,0)}50%{box-shadow:0 0 16px rgba(167,139,250,.95)}}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sel{outline:2px solid var(--accent);outline-offset:-1px}
  .btn.icon{padding:8px 11px;font-size:15px;line-height:1}
  .spd{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
  .spd .btn{padding:6px 10px}
  /* touch: remove tap delay + text selection on interactive bits */
  .btn,.buy,.hero-card,[data-spd]{touch-action:manipulation;user-select:none}
  /* mobile / narrow screens */
  @media (max-width:600px){
    header h1{font-size:13px}
    .stats{gap:10px;font-size:12px;width:100%;margin-left:0}
    .hero-card{min-width:132px;padding:7px 8px}
    .controls{gap:6px}
    .controls .btn{padding:8px 9px;font-size:11px}
    .spd{width:100%;margin-left:0;justify-content:flex-end}
  }
  @media (max-width:380px){ .hero-card{min-width:120px} }
  .modal{position:fixed;inset:0;background:rgba(4,6,15,.82);display:none;
    align-items:center;justify-content:center;z-index:30;padding:16px}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    max-width:440px;width:100%;padding:20px;max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 10px;color:var(--accent);font-size:18px}
  .modal p{font-size:13px;line-height:1.55;color:var(--text)}
  .shard-shop{display:grid;gap:8px;margin:12px 0}
  .shard-item{display:flex;align-items:center;gap:10px;background:var(--panel2);
    border:1px solid var(--line);border-radius:9px;padding:9px}
  .shard-item .info{flex:1;font-size:12px}
  .shard-item .info b{color:var(--shard)}
  .shard-item .lv{font-size:11px;color:var(--muted)}
  .branch-title{font-size:12px;font-weight:700;color:var(--accent);margin:10px 2px 2px}
  /* Keystone picker */
  .ks-list{display:grid;gap:8px;margin:12px 0}
  .ks{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);
    border:1px solid var(--line);border-left:4px solid var(--kc,#888);border-radius:10px;
    padding:10px;cursor:pointer;transition:transform .08s}
  .ks:active{transform:scale(.99)}
  .ks.on{outline:2px solid var(--kc,#888);outline-offset:-1px;
    box-shadow:0 0 14px color-mix(in srgb, var(--kc) 55%, transparent)}
  .ks-ic{font-size:22px;line-height:1}
  .ks-nm{font-size:13px;font-weight:800;color:var(--kc,#e8ecff)}
  .ks-desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:2px}
  .ks-locked{opacity:.5;cursor:default;filter:grayscale(.5)}
  .ks-lock{text-align:center;padding:22px 12px;background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;margin:12px 0}
  .ks-lock-ic{font-size:40px;line-height:1;filter:grayscale(.2)}
  .ks-lock-msg{font-size:15px;font-weight:800;color:#e8ecff;margin-top:10px}
  .ks-lock-sub{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
  .btn.locked{opacity:.55}
  /* not-yet-unlocked controls: shown but greyed + non-interactive */
  .feat-locked{opacity:.4;filter:grayscale(.7);cursor:not-allowed}
  .feat-locked:active{transform:none}
  /* Overdrive gauge button (bottom-left of the battlefield) */
  #odBtn{position:absolute;left:12px;bottom:12px;z-index:15;width:74px;height:40px;
    border:2px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);
    font-size:16px;font-weight:800;cursor:pointer;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:4px;touch-action:manipulation;user-select:none}
  #odBtn b{font-size:11px;position:relative;z-index:2}
  #odFill{position:absolute;left:0;top:0;bottom:0;width:0%;z-index:1;
    background:linear-gradient(90deg,#8a5a10,#e0a72e);transition:width .15s}
  #odBtn.ready{border-color:#ffd75e;box-shadow:0 0 14px rgba(255,215,94,.7);animation:odPulse 1s infinite}
  #odBtn.active{border-color:#7bd3ff;box-shadow:0 0 18px rgba(123,211,255,.8)}
  #odBtn.active #odFill{background:linear-gradient(90deg,#1a6a9a,#7bd3ff)}
  @keyframes odPulse{50%{box-shadow:0 0 26px rgba(255,215,94,1)}}
  .toast{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    background:rgba(20,24,48,.92);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:20}
  .toast.show{opacity:1}
  .float{position:absolute;font-size:12px;font-weight:700;pointer-events:none;
    animation:floatUp 1s ease-out forwards;text-shadow:0 1px 2px #000}
  @keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}
  /* ---- Bestiary codex (parchment + ornate framed monster entries) ---- */
  .modal .box.wide{max-width:680px}
  .bestiary{background:
      radial-gradient(140% 120% at 50% -10%, #ece0b8 0%, #d9c491 46%, #c1a86f 100%);
    border:3px solid #6b4e2a;border-radius:12px;padding:14px;color:#3a2c14;
    box-shadow:inset 0 0 46px rgba(90,60,20,.4);
    background-image:radial-gradient(140% 120% at 50% -10%, #ece0b8 0%, #d9c491 46%, #c1a86f 100%),
      repeating-linear-gradient(90deg, rgba(120,90,40,.05) 0 2px, transparent 2px 4px)}
  .bestiary-title{text-align:center;font-family:'Courier New',monospace;font-weight:800;
    letter-spacing:2px;font-size:16px;color:#f4e4b0;text-transform:uppercase;
    background:linear-gradient(#4a3418,#2a1d0d);border:2px solid #8a6a34;border-radius:8px;
    padding:8px 10px;margin:0 auto 14px;max-width:440px;
    box-shadow:0 2px 0 #170f06, inset 0 0 14px rgba(0,0,0,.55)}
  .bestiary-sub{text-align:center;font-family:'Courier New',monospace;font-size:11px;
    color:#5a4526;margin:-8px 0 12px;letter-spacing:.5px}
  .bestiary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .mon-card{background:linear-gradient(#cab27a,#b6975c);border:2px solid #7a5a2e;
    border-radius:8px;padding:8px;box-shadow:inset 0 0 10px rgba(90,60,20,.3)}
  .mon-card.locked{filter:saturate(.5) brightness(.92)}
  .mon-kills{position:absolute;top:4px;right:5px;font-family:'Courier New',monospace;
    font-size:11px;font-weight:700;color:#ffe0b0;background:rgba(0,0,0,.5);
    border-radius:5px;padding:1px 6px}
  .mon-frame{position:relative;height:124px;border-radius:6px;overflow:hidden;
    border:3px solid var(--fc,#4a7a3a);
    background:radial-gradient(120% 110% at 50% 24%, #6a5a3a, #33281a);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 20px rgba(0,0,0,.55)}
  .mon-frame canvas{image-rendering:pixelated;max-width:100%;max-height:100%}
  .mon-frame::before,.mon-frame::after{content:'';position:absolute;width:11px;height:11px;
    border:2px solid var(--fc,#4a7a3a)}
  .mon-frame::before{top:3px;left:3px;border-right:0;border-bottom:0}
  .mon-frame::after{bottom:3px;right:3px;border-left:0;border-top:0}
  .mon-plaque{margin-top:8px;background:linear-gradient(#241a0d,#352a18);
    border:2px solid #6a4e26;border-radius:6px;padding:7px 9px;
    font-family:'Courier New',monospace;line-height:1.5}
  .mon-plaque .nm{font-weight:800;color:#ffe9a8;letter-spacing:1px;font-size:13px}
  .mon-plaque .st{font-size:11px;color:#cdbb86;font-variant-numeric:tabular-nums}
  .mon-plaque .el{font-size:11px;color:var(--fc,#8fd07a);font-weight:700;letter-spacing:1px}
  .mon-plaque .wr{font-size:10px;color:#cdbb86;margin-top:2px;letter-spacing:.3px}
  .mon-plaque .ab{font-size:10px;color:#8fd0ff;margin-top:2px}
  .bestiary-close{width:100%;margin-top:14px}
  @media (max-width:560px){ .bestiary-grid{grid-template-columns:1fr} }
  /* ---- Relics ---- */
  .relic-slots{display:flex;gap:8px;margin:6px 0 12px}
  .relic-slot{flex:1;aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--panel2);
    cursor:pointer;position:relative}
  .relic-slot.filled{border-style:solid}
  .relic-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:46vh;overflow:auto}
  .relic{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
    border-left:4px solid var(--rc,#9fb0d8);border-radius:9px;padding:8px;cursor:pointer}
  .relic.eq{outline:2px solid var(--rc,#9fb0d8);outline-offset:-1px}
  .relic .ic{font-size:20px}
  .relic .rn{font-size:12px;font-weight:700}
  .relic .rd{font-size:10px;color:var(--muted)}
  .relic .rr{font-size:10px;font-weight:700;color:var(--rc,#9fb0d8)}
  .relic.mythic{border-color:#ffd75e;background:linear-gradient(120deg,#3a2f12,#26200e);
    box-shadow:0 0 10px rgba(255,215,94,.5);animation:mythShine 1.6s ease-in-out infinite}
  .relic.mythic .rn{color:#ffe9a0}
  .relic.mythic .ic{filter:drop-shadow(0 0 4px rgba(255,215,94,.9))}
  @keyframes mythShine{0%,100%{box-shadow:0 0 8px rgba(255,215,94,.4)}50%{box-shadow:0 0 20px rgba(255,215,94,.95)}}
  .relic-del{flex:0 0 auto;border:1px solid var(--line);background:#2a1420;color:#ff8a8a;
    border-radius:7px;padding:5px 7px;font-size:13px;cursor:pointer;line-height:1}
  .relic-del:active{transform:scale(.94)} .relic-del:hover{background:#3a1a26;border-color:var(--danger)}
  @media (max-width:560px){ .relic-list{grid-template-columns:1fr} }
</style>

<div id="game">
  <header>
    <h1>⟡ Echoes of the Aether Crystal</h1>
    <div class="stats">
      <div class="stat g-wave">🌊 Stage <b id="s-wave">1-1</b></div>
      <div class="stat g-gold">🪙 <b id="s-gold">0</b></div>
      <div class="stat g-shard">💠 <b id="s-shard">0</b></div>
      <div class="stat" style="color:var(--hp)">🌳 <b id="s-tp">0</b></div>
      <div class="stat"><span class="g-hp">💎</span> <b id="s-crystal">100%</b></div>
    </div>
  </header>

  <div class="stage-wrap">
    <canvas id="stage"></canvas>
    <div id="wavebanner">Wave 1</div>
    <button id="odBtn" title="Overdrive">⚡<span id="odFill"></span><b id="odTxt">0%</b></button>
    <div id="toast" class="toast"></div>
  </div>

  <div class="panel" id="heroPanel"></div>

  <div class="controls">
    <button class="btn prestige" id="btnPrestige">💠 Reseal Crystal (Prestige)</button>
    <button class="btn" id="btnShop">💠 Shard Shop</button>
    <button class="btn" id="btnTalents">🌳 Talents</button>
    <button class="btn" id="btnKeystone">⭐ Keystone</button>
    <button class="btn" id="btnAch">🏆 Achievements</button>
    <button class="btn" id="btnBestiary">📖 Bestiary</button>
    <button class="btn" id="btnRelics">🗡️ Relics</button>
    <button class="btn" id="btnTower">🏰 Fortify</button>
    <button class="btn" id="btnAuto" title="Auto-buy the cheapest hero upgrade">🅰️ Auto</button>
    <button class="btn" id="btnStats">📊 Stats</button>
    <button class="btn" id="btnSave" title="Save slots — keep up to 5 games and load any of them">💾 Saves</button>
    <button class="btn" id="btnNewStart" title="Delete all progress and start a fresh game">🆕 New Start</button>
    <button class="btn icon" id="btnMusic" title="Music on/off">♪</button>
    <button class="btn icon" id="btnMute" title="Mute all">🔊</button>
    <button class="btn icon" id="btnSheets" title="HD sprite sheets (needs assets/*.png)">🎨</button>
    <button class="btn icon" id="btnSettings" title="Settings">⚙️</button>
    <button class="btn" id="btnBuyMode" title="Hero buy amount">🛒 Buy ×1</button>
    <div class="spd">
      Speed
      <button class="btn" data-spd="1">1×</button>
      <button class="btn" data-spd="2">2×</button>
      <button class="btn" data-spd="3">3×</button>
    </div>
  </div>
</div>

<!-- Offline / Prestige / Shop modal -->
<div class="modal" id="modal">
  <div class="box" id="modalBox"></div>
</div>

<script src="sprites.js?v=49"></script>
<script src="dungeon.js?v=49"></script>
<script src="sheets.js?v=49"></script>
<script src="audio.js?v=49"></script>
