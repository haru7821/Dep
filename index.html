<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Echoes of the Aether Crystal — 방치형 디펜스</title>
<style>
  :root{
    --bg:#0b0d1a; --panel:#141830; --panel2:#1d2244; --accent:#7bd3ff; --gold:#ffd75e;
    --shard:#c58bff; --hp:#57e18a; --danger:#ff6b6b; --text:#e8ecff; --muted:#8b93c4;
    --line:#2a3160;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,'Malgun Gothic',sans-serif;overflow:hidden}
  #game{display:flex;flex-direction:column;height:100%;max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;letter-spacing:.5px;color:var(--accent);
    text-shadow:0 0 10px rgba(123,211,255,.4);white-space:nowrap}
  .stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-left:auto}
  .stat{display:flex;align-items:center;gap:5px}
  .stat b{font-variant-numeric:tabular-nums}
  .g-gold{color:var(--gold)} .g-shard{color:var(--shard)} .g-wave{color:var(--accent)}
  .stage-wrap{position:relative;flex:1;min-height:0;background:#05060f}
  #stage{display:block;width:100%;height:100%;image-rendering:pixelated}
  #wavebanner{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(20,24,48,.85);border:1px solid var(--line);border-radius:20px;
    padding:4px 16px;font-size:13px;pointer-events:none;transition:opacity .3s}
  .panel{background:var(--panel);border-top:1px solid var(--line);padding:8px;
    display:flex;gap:8px;overflow-x:auto}
  .hero-card{flex:1 1 0;min-width:150px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;position:relative;transition:transform .08s}
  .hero-card.locked{opacity:.5;filter:grayscale(.7)}
  .hero-card:not(.locked):active{transform:scale(.98)}
  .hero-card h3{margin:0 0 2px;font-size:13px;display:flex;align-items:center;gap:6px}
  .hero-card .role{font-size:10px;color:var(--muted);margin-bottom:6px}
  .hero-card .stat-row{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  .hero-card .stat-row b{color:var(--text)}
  .buy{margin-top:6px;width:100%;border:0;border-radius:7px;padding:7px;cursor:pointer;
    font-weight:700;font-size:12px;background:linear-gradient(#f2c14a,#e0a72e);color:#3a2a00}
  .buy:disabled{background:#333a5c;color:#6a72a0;cursor:not-allowed}
  .buy small{display:block;font-weight:400;font-size:10px;opacity:.8}
  .skill-row{margin-top:6px;font-size:11px;color:var(--accent);display:flex;align-items:center;gap:4px}
  .cd-bar{height:4px;background:#0d1128;border-radius:3px;overflow:hidden;margin-top:3px}
  .cd-fill{height:100%;width:0%;border-radius:3px;transition:width .12s linear}
  .lock-tag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--muted);text-align:center;padding:8px}
  .controls{display:flex;gap:8px;padding:8px;background:var(--panel);
    border-top:1px solid var(--line);flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);
    border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:600}
  .btn:active{transform:scale(.97)}
  .btn.prestige{background:linear-gradient(#8b5cf6,#6d28d9);border-color:#8b5cf6}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sel{outline:2px solid var(--accent);outline-offset:-1px}
  .btn.icon{padding:8px 11px;font-size:15px;line-height:1}
  .spd{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
  .spd .btn{padding:6px 10px}
  /* touch: remove tap delay + text selection on interactive bits */
  .btn,.buy,.hero-card,[data-spd]{touch-action:manipulation;user-select:none}
  /* mobile / narrow screens */
  @media (max-width:600px){
    header h1{font-size:13px}
    .stats{gap:10px;font-size:12px;width:100%;margin-left:0}
    .hero-card{min-width:132px;padding:7px 8px}
    .controls{gap:6px}
    .controls .btn{padding:8px 9px;font-size:11px}
    .spd{width:100%;margin-left:0;justify-content:flex-end}
  }
  @media (max-width:380px){ .hero-card{min-width:120px} }
  .modal{position:fixed;inset:0;background:rgba(4,6,15,.82);display:none;
    align-items:center;justify-content:center;z-index:30;padding:16px}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    max-width:440px;width:100%;padding:20px;max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 10px;color:var(--accent);font-size:18px}
  .modal p{font-size:13px;line-height:1.55;color:var(--text)}
  .shard-shop{display:grid;gap:8px;margin:12px 0}
  .shard-item{display:flex;align-items:center;gap:10px;background:var(--panel2);
    border:1px solid var(--line);border-radius:9px;padding:9px}
  .shard-item .info{flex:1;font-size:12px}
  .shard-item .info b{color:var(--shard)}
  .shard-item .lv{font-size:11px;color:var(--muted)}
  .branch-title{font-size:12px;font-weight:700;color:var(--accent);margin:10px 2px 2px}
  .toast{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    background:rgba(20,24,48,.92);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:20}
  .toast.show{opacity:1}
  .float{position:absolute;font-size:12px;font-weight:700;pointer-events:none;
    animation:floatUp 1s ease-out forwards;text-shadow:0 1px 2px #000}
  @keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}
</style>

<div id="game">
  <header>
    <h1>⟡ Echoes of the Aether Crystal</h1>
    <div class="stats">
      <div class="stat g-wave">🌊 Wave <b id="s-wave">1</b></div>
      <div class="stat g-gold">🪙 <b id="s-gold">0</b></div>
      <div class="stat g-shard">💠 <b id="s-shard">0</b></div>
      <div class="stat" style="color:var(--hp)">🌳 <b id="s-tp">0</b></div>
      <div class="stat"><span class="g-hp">💎</span> <b id="s-crystal">100%</b></div>
    </div>
  </header>

  <div class="stage-wrap">
    <canvas id="stage"></canvas>
    <div id="wavebanner">Wave 1</div>
    <div id="toast" class="toast"></div>
  </div>

  <div class="panel" id="heroPanel"></div>

  <div class="controls">
    <button class="btn prestige" id="btnPrestige">💠 Reseal Crystal (Prestige)</button>
    <button class="btn" id="btnShop">💠 Shard Shop</button>
    <button class="btn" id="btnTalents">🌳 Talents</button>
    <button class="btn" id="btnAch">🏆 Achievements</button>
    <button class="btn" id="btnStats">📊 Stats</button>
    <button class="btn" id="btnReset">Reset Save</button>
    <button class="btn icon" id="btnMusic" title="Music on/off">♪</button>
    <button class="btn icon" id="btnMute" title="Mute all">🔊</button>
    <button class="btn icon" id="btnSheets" title="HD sprite sheets (needs assets/*.png)">🎨</button>
    <div class="spd">
      Speed
      <button class="btn" data-spd="1">1×</button>
      <button class="btn" data-spd="2">2×</button>
      <button class="btn" data-spd="3">3×</button>
    </div>
  </div>
</div>

<!-- Offline / Prestige / Shop modal -->
<div class="modal" id="modal">
  <div class="box" id="modalBox"></div>
</div>

<script src="sprites.js"></script>
<script src="sheets.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
